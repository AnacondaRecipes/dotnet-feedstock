anaconda_config_version: 1
upstream_sources:
  - github:
      identifier: dotnet/sdk
      use_max_tag: true
      include_regex: ^v[\d.]+$
      from_pattern: ^v(.+)$
      to_pattern: \1
    packages:
      - dotnet
      - dotnet-runtime
      - dotnet-sdk
      - dotnet-aspnetcore
      - dotnet-desktop
