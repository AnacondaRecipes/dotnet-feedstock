{% set sdk_version = "8.0.100" %}
{% set runtime_version = "8.0.0" %}
{% set framework = '.'.join(sdk_version.split('.')[:2]) %}
{% set ext = "tar.gz" %}      # [unix]
{% set ext = "zip" %}         # [win]

package:
  name: dotnet
  version: {{ sdk_version }}

source:
  # Linux aarch64
  - url: https://dotnetcli.azureedge.net/dotnet/Sdk/{{ sdk_version }}/dotnet-sdk-{{ sdk_version }}-linux-arm64.{{ ext }}  # [linux and aarch64]
    sha256: 67a077720d5affc9bfa8bcffbbaa17c0edda25dba59638fd1888d8fc62d78b16                                              # [linux and aarch64]
    folder: dotnet                                                                                                        # [linux and aarch64]

  # Linux x86_64
  - url: https://dotnetcli.azureedge.net/dotnet/Sdk/{{ sdk_version }}/dotnet-sdk-{{ sdk_version }}-linux-x64.{{ ext }}  # [linux and x86_64]
    sha256: 550692ae3233e69692822b8be31bb01c5a2b60c3cfa59e9bfce8278b99f36211                                            # [linux and x86_64]
    folder: dotnet                                                                                                      # [linux and x86_64]

  # macOS arm64
  - url: https://dotnetcli.azureedge.net/dotnet/Sdk/{{ sdk_version }}/dotnet-sdk-{{ sdk_version }}-osx-arm64.{{ ext }}  # [osx]
    sha256: e6ba41f9340fe71875bb569df92fa8e400f0cf71abf3cf19e5f1f8bd5e3e7bf5                                            # [osx]
    folder: dotnet                                                                                                      # [osx]

  # Windows x64
  - url: https://dotnetcli.azureedge.net/dotnet/Sdk/{{ sdk_version }}/dotnet-sdk-{{ sdk_version }}-win-x64.{{ ext }}    # [win]
    sha256: fc225bcce6b54385580a16216e484b6119452ff6febac7da4e2a7e1fdee09921                                            # [win]
    folder: dotnet                                                                                                      # [win]

build:
  number: 2
  binary_relocation: False

outputs:
  - name: dotnet
    version: {{ sdk_version }}
    requirements:
      run:
        - {{ pin_subpackage('dotnet-aspnetcore') }}
        - {{ pin_subpackage('dotnet-desktop') }}    # [win]
        - {{ pin_subpackage('dotnet-runtime') }}
        - {{ pin_subpackage('dotnet-sdk') }}
    test:
      commands:
        - test "${DOTNET_ROOT}" = "${CONDA_PREFIX}/lib/dotnet"         # [unix]
        - test "${DOTNET_TOOLS}" = "${CONDA_PREFIX}/lib/dotnet/tools"  # [unix]
        - if not defined DOTNET_ROOT exit 1   # [win]
        - if not defined DOTNET_TOOLS exit 1  # [win]

  - name: dotnet-runtime
    version: {{ runtime_version }}
    script: build-runtime.bat  # [win]
    script: build-runtime.sh   # [unix]
    build:
      binary_relocation: False
      runpath_whitelist:               # [unix]
        - $ORIGIN                      # [unix]
        - $ORIGIN/.*                   # [unix]
      missing_dso_whitelist:
        - "*"
      script_env:
      - DOTNET_RUNTIME_VERSION={{ runtime_version }}
    requirements:
      host:
        - icu {{ icu }}          # [unix]
        - openssl  {{ openssl }} # [aarch64]
      run:
        - icu      # [unix]
        - openssl  # [aarch64]
    test:
      commands:
        - dotnet --list-runtimes
    about:
      home: https://github.com/dotnet/runtime
      license: MIT
      license_file: dotnet/LICENSE.txt
      summary: |
        .NET Core is a free and open-source managed computer software
        framework for the Windows, Linux, and macOS operating systems.

  - name: dotnet-sdk
    version: {{ sdk_version }}
    script: build-sdk.bat  # [win]
    script: build-sdk.sh   # [unix]
    build:
      binary_relocation: False
      runpath_whitelist:               # [unix]
        - $ORIGIN                      # [unix]
        - $ORIGIN/.*                   # [unix]
      missing_dso_whitelist:
        - "*"
    requirements:
      run:
        - {{ pin_subpackage('dotnet-runtime') }}
    test:
      requires:
        - icu      # [linux]
      commands:
        - test -d $PREFIX/lib/dotnet/packs      # [unix]
        - test -d $PREFIX/lib/dotnet/sdk        # [unix]
        - test -d $PREFIX/lib/dotnet/templates  # [unix]
        - if not exist %PREFIX%\\dotnet\\packs exit 1      # [win]
        - if not exist %PREFIX%\\dotnet\\sdk exit 1        # [win]
        - if not exist %PREFIX%\\dotnet\\templates exit 1  # [win]
        - export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1   # [linux]
        - dotnet --version
        - mkdir self-test && cd self-test && dotnet new console --framework net{{ framework }}            # [unix]
        - dotnet build -c Debug --framework net{{ framework }}                                            # [unix]
        - dotnet run --no-restore --no-build --framework net{{ framework }} | grep -F "Hello, World!"     # [unix]
        - mkdir self-test && cd self-test && dotnet new console --framework net{{ framework }}            # [win]
        - dotnet build -c Debug --framework net{{ framework }}                                            # [win]
        - dotnet run --no-restore --no-build --framework net{{ framework }} | findstr /C:"Hello, World!"  # [win]

    about:
      home: https://github.com/dotnet/sdk
      license: MIT
      license_file: dotnet/LICENSE.txt
      summary: |
        .NET Core is a free and open-source managed computer software
        framework for the Windows, Linux, and macOS operating systems.

  - name: dotnet-aspnetcore
    version: {{ runtime_version }}
    script: build-aspnetcore.bat  # [win]
    script: build-aspnetcore.sh   # [unix]
    build:
      binary_relocation: False
      missing_dso_whitelist:
        - "*"
    requirements:
      build:
      run:
        - {{ pin_subpackage('dotnet-runtime') }}
    test:
      commands:
        - test -d $PREFIX/lib/dotnet/shared/Microsoft.AspNetCore.App              # [unix]
        - if not exist %PREFIX%\\dotnet\\shared\\Microsoft.AspNetCore.App exit 1  # [win]
    about:
      home: https://github.com/dotnet/aspnetcore
      license: MIT
      license_file: dotnet/LICENSE.txt
      summary: |
        .NET Core is a free and open-source managed computer software
        framework for the Windows, Linux, and macOS operating systems.

  - name: dotnet-desktop                                                              # [win]
    version: {{ runtime_version }}                                                    # [win]
    script: build-desktop.bat                                                         # [win]
    build:                                                                            # [win]
      binary_relocation: False                                                        # [win]
      missing_dso_whitelist:                                                          # [win]
        - "*"                                                                         # [win]
    requirements:                                                                     # [win]
      run:                                                                            # [win]
        - {{ pin_subpackage('dotnet-runtime') }}                                      # [win]
    test:                                                                             # [win]
      commands:                                                                       # [win]
        - if not exist %PREFIX%\\dotnet\\shared\\Microsoft.WindowsDesktop.App exit 1  # [win]
    about:                                                                            # [win]
      home: https://github.com/dotnet/desktop                                         # [win]
      license: MIT                                                                    # [win]
      license_file: dotnet/LICENSE.txt                                                # [win]
      summary: .NET Core is a free and open-source managed computer software framework for the Windows, Linux, and macOS operating systems.  # [win]

about:
  home: https://github.com/dotnet/core
  license: MIT
  license_file: dotnet/LICENSE.txt
  license_family: MIT
  summary: free, cross-platform, open source developer platform for building many different types of applications
  description: |
    .NET Core is a free and open-source managed computer software
    framework for the Windows, Linux, and macOS operating systems
  dev_url: https://github.com/dotnet/core
  doc_url: https://github.com/dotnet/core

extra:
  recipe-maintainers:
    - dhirschfeld
    - ZimmerA
    - acesnik
